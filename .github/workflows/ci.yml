# Continuous integration for waydroid-hp-envy-x2.
#
# Two jobs, split by what they need, not by how long they take:
#
#   tests  tests/run.sh with CI=true -- Python, C++ and Kotlin unit tests, the
#          RPMs' %check self-tests, shellcheck, ruff, actionlint, zizmor and
#          gitleaks. The same script lefthook runs
#          before a push, so nothing can pass locally and mean something
#          different here. CI=true turns a missing toolchain from a SKIP into a
#          failure, so this job cannot quietly stop testing something.
#
#   rpm    Every shipped modification built FROM SOURCE on Fedora, then
#          installed, edited and uninstalled by packaging/test-install.sh. This
#          is the one build the dev box cannot do: sensord and wifid compile
#          against Fedora's libgbinder-devel/libglibutil-devel, which is why
#          docs/53 says "the two compiled daemons cannot be built off this dev
#          box at all" and why build-mod.sh has --prebuilt. Here they need no
#          --prebuilt. --privileged is for test-install.sh's `unshare -r`,
#          which Docker's default seccomp profile refuses. Then every unit
#          the packages ship goes through `systemd-analyze verify`.
#
#   signatures
#          bin/check-signed-commits.sh over every commit reachable from the
#          tip, against ONLY the keys in .github/commit-signers.asc. The same
#          gate as the local pre-push hook; here it also catches a push made
#          with the hook absent or bypassed. Signing is load-bearing in this
#          repository -- it is what makes committed build output acceptable
#          (AGENTS.md, "What we built ourselves is not external").
#
# Not here, deliberately:
#   - The bin/*-test.sh integration tests. They drive a live Android over ssh.
#   - Signing, publishing, CodeQL and scanners -- docs/53's later steps.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag: a tag can be moved to
# different code after review, a commit cannot. The comment names the release;
# .github/dependabot.yml proposes the bumps, and zizmor in tests/run.sh fails
# on an unpinned `uses:`.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # All of history, for gitleaks.
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchains
        # python3-dbus and python3-gi so test_btd.py runs against the real
        # bindings' type hierarchy rather than tests/_scripts.py's stand-in.
        # shellcheck is preinstalled on the image but named so a newer image
        # without it fails here, loudly, instead of in the lint suite.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libglib2.0-dev python3 python3-dbus python3-gi \
            openssl shellcheck
          pipx install ruff==0.16.10
          pipx install actionlint-py==1.7.12.25
          pipx install zizmor==1.31.1
      - name: gitleaks
        # Not packaged for Ubuntu or PyPI: the release tarball, pinned by
        # version and by sha256 from that release's checksums file.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Android platform (android.jar for the Kotlin tests)
        # The runner image ships an SDK; this makes sure the one platform the
        # apps compile against is in it. JAVA_HOME is the image's JDK 17.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" >/dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/test-deps
          key: test-deps-${{ hashFiles('tests/kotlin/fetch-deps.sh') }}
      - name: Kotlin test dependencies
        # Pinned and SHA-256 checked; see the script header.
        run: tests/kotlin/fetch-deps.sh
      - name: tests/run.sh
        run: tests/run.sh

  signatures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: the gate checks every commit in the branch.
          fetch-depth: 0
          # On a pull request, the PR's own tip, not the unsigned merge
          # commit GitHub synthesises for it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Import the accepted signing keys
        # On a pull request the key file comes from the BASE branch, so a PR
        # cannot vouch for itself by adding its own key. %G? accepts any key
        # in the keyring, so this file is the whole list of who may sign.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git show "origin/$BASE_REF:.github/commit-signers.asc"
          else
            cat .github/commit-signers.asc
          fi | gpg --batch --import
      - name: bin/check-signed-commits.sh
        run: bin/check-signed-commits.sh --branch HEAD

  rpm:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
      options: --privileged
    steps:
      - name: Install build tooling
        # git before checkout, or actions/checkout falls back to the REST API
        # and the tree has no .git for gen-spec.sh and friends.
        run: |
          dnf -y -q install git rpm-build rpmlint dnf-plugins-core \
            systemd-rpm-macros util-linux findutils tar gzip systemd cpio
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Source packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/build-mod.sh --srpm --all
      - name: Build dependencies
        run: dnf -y -q builddep build/rpm/SRPMS/*.src.rpm
      - name: Build and lint every shipped modification
        # rpmlint reports here but does not gate: build-mod.sh runs it with
        # `|| true` against waydroid-ext.rpmlintrc's accepted baseline.
        run: packaging/build-mod.sh --lint --all
      - name: Install / edit / uninstall test
        run: packaging/test-install.sh --selftest --all
      - name: systemd-analyze verify every shipped unit
        # Against the units as packaged, placeholders substituted; see the
        # script header for what is stubbed and why.
        run: packaging/verify-units.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms
          path: |
            build/rpm/RPMS/
            build/rpm/SRPMS/
          retention-days: 14
