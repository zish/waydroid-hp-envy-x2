# What waydroid-mdns-reflector puts into /etc/avahi/avahi-daemon.conf and
# firewalld, so that the host's LAN mDNS services are discoverable from inside
# the Waydroid container. docs/45-mdns-reflection.md has the whole story,
# including why forwarding the multicast could never have worked and why this is
# an application-layer relay instead.
#
# Four keys are accepted here and no others. Three of them are avahi's own
# [reflector] settings and are merged into avahi-daemon.conf in place, keeping
# the rest of that file -- which belongs to the avahi package -- untouched:
#
#   enable-reflector  reflect-ipv  reflect-filters
#
# An empty value means "leave avahi's own default alone". An unrecognised key is
# refused rather than written, because avahi refuses to START on an unknown key
# in its configuration, which would leave this host with no mDNS at all.
#
# The fourth key, firewall-zone, is this tool's own and is at the bottom.

enable-reflector=yes

# Which services cross between the LAN and the container.
#
# This is not only a noise control. The reflector will otherwise advertise
# Android's own _adb._tcp to the LAN at 192.168.240.112, an address nothing on
# the LAN has a route to, so the filter is also what keeps unreachable junk off
# the network. Measured: 9 packets in 12 s unfiltered, 6 filtered, with the
# printer's records complete either way.
#
# Two traps worth knowing before editing it:
#
#   QUESTIONS CROSS REGARDLESS. The filter governs which services are
#     reflected, not which queries are, so a LAN device's query for a service
#     not listed here still arrives. The filter is not a privacy boundary.
#   THE META-QUERY IS NOT LISTED. A client that enumerates service types before
#     browsing them asks for _services._dns-sd._udp.local and will find
#     nothing. Neither print service does that -- both ask for _ipp/_ipps
#     directly -- but the next client might, and adding it here is the fix.
reflect-filters=_ipp._tcp.local,_ipps._tcp.local,_printer._tcp.local,_googlecast._tcp.local,_airplay._tcp.local,_raop._tcp.local

# Left at avahi's default of no, deliberately, by being commented out: the
# container has only a link-local fe80:: on wlan0 and no global IPv6, so a
# reflected v6 service is one Android can discover and never connect to.
#reflect-ipv=no

# The firewalld zone that gets the udp-source-port-5353 rule, without which a
# one-shot (legacy unicast) mDNS query gets no answer -- which is how the Mopria
# Print Service asks, and why it searched forever while the platform's own
# print service worked.
#
# Empty means firewalld's default zone. On the reference host that is `public`,
# which is the zone the LAN interface is in, so the default is right here and
# derived rather than guessed on any other machine. Name a zone to override it.
#
# Set this to `none` to skip the firewall half entirely. Understand what you
# are turning off and what you are keeping: the rule accepts UDP from any LAN
# host willing to send FROM port 5353 to ANY high port on this machine. That is
# a real, if small, widening of this host's exposure, and it is accepted because
# avahi re-originates a legacy-unicast query from an unpredictable ephemeral
# port, so there is no narrower destination-port rule to write. With it off,
# clients that query properly from port 5353 still work.
firewall-zone=
