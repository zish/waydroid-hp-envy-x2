# Waydroid: shut Android down before the compositor goes away.
#
# Installed at /etc/sway/config.d/95-waydroid-graceful-exit.conf when staged by
# install.sh, and at /usr/share/sway/config.d/95-waydroid-graceful-exit.conf when
# shipped in an RPM -- that directory is owned by sway-config-fedora and is where
# a package is allowed to put a drop-in. See docs/24 for the include-path caveat
# that makes the /usr/share copy inert on a host whose personal config omits it.
#
# Sway's stock config ends with an include of the config.d directories, which is
# parsed AFTER the exit binding earlier in the file, and a later bindsym wins. So
# this file replaces the exit chord for every user on the host without editing
# anybody's ~/.config/sway/config.
#
# This is the race-free trigger: the wrapper runs to completion, with the
# compositor still up, before swaymsg exit is called. The systemd-user unit is a
# backstop for logouts that do not come through this chord, and it necessarily
# runs after sway has begun tearing down -- see docs/24.
#
# --no-warn is load-bearing, not tidiness. Overwriting a binding makes sway call
# config_add_swaynag_warning(), which raises the nag titled "There are errors in
# your config file" on every reload and every login. Without the flag this file
# works perfectly and still nags, and the nag is close to undebuggable: the
# matching log line is emitted at [INFO], below sway's default log level, so the
# journal stays empty, and the warning is suppressed when config->validating is
# set, so `sway --validate` reports the config clean. See docs/24.
#
# $mod comes from the config that includes this file; every config derived from
# Fedora's /etc/sway/config defines it.

bindsym --no-warn $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? Android will be shut down first, then this will end your Wayland session.' -B 'Yes, exit sway' '@BINDIR@/waydroid-graceful-exit --exit-sway'
