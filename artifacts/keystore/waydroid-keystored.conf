# Arguments for waydroid-keystored, read by waydroid-keystored.service.
#
# Installed at /etc/waydroid-keystored.conf. Edit it and restart the service
# BETWEEN sessions: keystore2 negotiates with the StrongBox once a session, so a
# daemon restarted during one is a party Android never negotiated with, and
# keys bound to the lockscreen fail until the next login (docs/73, docs/74).
#
# --accept-unsigned-auth-tokens
#     Waydroid's Android 13 gatekeeper, gatekeeper.waydroid.so, signs nothing:
#     every HardwareAuthToken it issues carries a MAC of 32 zero bytes
#     (docs/74). Without this flag those tokens are refused, so a StrongBox key
#     bound to the lockscreen -- setUserAuthenticationRequired(true) -- can be
#     created and never used. With it, an all-zero MAC is accepted and
#     everything else about the token is still enforced: the secure ID, the
#     authenticator type, the age, and the TEE's verification token. The key
#     then reports its auth binding at the KEYSTORE level rather than claim
#     STRONGBOX enforcement it cannot verify, which is the truth on this image:
#     keystore2 is the real gate. Remove it on an image whose gatekeeper signs.
#
# --tcti TCTI
#     Which TPM. The default is waydroid-swtpm's socket,
#     swtpm:path=/run/swtpm-waydroid/sock. A host with a hardware TPM 2.0 uses
#     device:/dev/tpmrm0; the daemon runs as root, so the device's root:tss
#     0660 is no obstacle.
#
# --verbose
#     Logs every transaction, not only key operations and auth decisions.
WAYDROID_KEYSTORED_ARGS="--accept-unsigned-auth-tokens"
