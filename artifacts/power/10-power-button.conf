# Staged for /etc/systemd/logind.conf.d/10-power-button.conf on bigtab01.
#
# Short press  -> suspend (s2idle; the mode is forced by 10-s2idle.conf)
# Long press   -> clean poweroff, via logind's hardcoded long-press window
# Held further -> the PCH's power-button override cuts power in firmware.
#                 That stage is silicon and is not configurable from here.
#
# Default before this file: HandlePowerKey=poweroff, HandlePowerKeyLongPress=ignore
# i.e. a single short press powered the machine straight off.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
