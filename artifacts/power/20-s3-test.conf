# TEMPORARY — staged for /etc/systemd/sleep.conf.d/20-s3-test.conf on bigtab01.
#
# Sorts after 10-s2idle.conf and therefore wins, switching suspend from
# suspend-to-idle back to genuine ACPI S3 for the standby comparison in
# docs/17-hybrid-sleep.md.
#
# Additive on purpose: 10-s2idle.conf is left untouched, so reverting to s2idle
# is `rm` of this one file and nothing else.
#
# NOTE the kernel's own default on this machine was `deep` — /sys/power/mem_sleep
# read "s2idle [deep]" before we overrode it. Broadwell-Y is early-generation
# S0ix and Linux cannot even report S0ix residency for it (intel_pmc_core covers
# Skylake and later), so measurement is the only evidence available.
[Sleep]
MemorySleepMode=deep
