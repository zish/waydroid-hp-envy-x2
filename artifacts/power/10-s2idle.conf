# Staged for /etc/systemd/sleep.conf.d/10-s2idle.conf on bigtab01.
#
# /sys/power/mem_sleep reads "s2idle [deep]" on this machine, so an unqualified
# suspend goes to S3. MemorySleepMode= writes s2idle to that file immediately
# before SuspendState=mem is used, which pins every systemd-initiated suspend
# to suspend-to-idle without a kernel argument or a reboot.
#
# Needs systemd >= 256; the host runs 259.
[Sleep]
MemorySleepMode=s2idle
