# Networks the host is willing to share with Android, one SSID per line.
#
# Installed at /etc/waydroid-wifi-share.conf and read by waydroid-wifi-sync.
#
# THIS FILE IS THE OPT-IN, AND IT IS DELIBERATELY THE ONLY ONE
#
# Importing a network copies its passphrase into Android's saved-network store,
# which on this image is CLEARTEXT:
#
#   /data/misc/apexdata/com.android.wifi/WifiConfigStore.xml
#   <string name="PreSharedKey">&quot;...&quot;</string>
#
# The file is mode 0600 system:system, so it is not world-readable, but it is
# not encrypted either and anything running as `system` can read it.  A laptop
# accumulates conference and coffee-shop credentials that have no business
# being in a container, so nothing is shared unless it is named here.
#
# Listing one file, rather than a flag on each NetworkManager profile, is a
# deliberate choice: you can audit exactly which passphrases have been copied
# into Android by reading this, and NM's `user` setting -- the obvious place for
# a per-profile marker -- is not compiled into Fedora's NetworkManager anyway
# ("invalid or not allowed setting 'user'", NM 1.56.1).
#
# MATCHING
#
# Lines are SSIDs, matched exactly, because SSID is the level Android and
# NetworkManager actually agree on -- Android keys saved networks by SSID and
# security type, and NM profile *names* are renameable display strings
# (docs/34-wifi-second-radio.md).  Leading and trailing whitespace is stripped;
# an SSID with internal spaces works as written.  Blank lines and # comments are
# ignored.
#
# DIRECTION
#
# NetworkManager is the source of truth.  Profiles named here are pushed into
# Android; forgetting one in Android deletes the matching NM profile.  See
# docs/36-wifi-credential-sync.md, especially the guards on that deletion.

# vidiot
