# Arguments for waydroid-wifid, read by waydroid-wifid.service.
#
# Installed at /etc/waydroid-wifid.conf.  Edit it and
# `systemctl restart waydroid-wifid`; the unit itself never needs touching.
#
# ---------------------------------------------------------------- the radio
#
# 60:57:18:0A:E8:B7 is wlp1s0, the machine's own internal Intel radio.  Handing
# Android the HOST'S OWN LINK is deliberate here and inverts what
# docs/34-wifi-second-radio.md set up -- see docs/38-wifi-primary-radio.md.
#
# The reason is what this machine is for: it is used entirely from inside the
# Android session, so Android manipulating NetworkManager IS the point.  A
# spare radio Android cannot strand the host with is only worth having while
# somebody administers the host from outside Android.  What that gives up is
# real -- Android's Wi-Fi toggle now acts on the link this machine is
# administered over, which is trap 5 of docs/33-wifi-stage4.md accepted as an
# operating mode rather than avoided.
#
# 34:E8:94:F8:61:70 is the other choice: the TP-Link Archer T3U (2357:012d,
# rtw88_8822bu) from docs/34.  Put it back here to hand Android the spare radio
# again and leave wlp1s0 to the host.  Note that the T3U has never completed an
# association with this AP; the kernel's "authentication ... timed out" and
# commit 9dbb8de both put that on rtw88_8822bu rather than on the AP.
#
# Either way the radio is named by MAC and not by interface name:
#
#   * wlp0s20u1 encodes the USB socket the adapter is in, so moving it one
#     port along renames it -- and this file is read by something unattended,
#     with nobody watching to notice.
#   * The daemon treats a --device it cannot find as FATAL rather than falling
#     back, so a stale name means Wi-Fi is simply down.  That is the safe
#     failure; the unsafe one is Android silently landing on a radio that
#     nobody chose for it.
#   * A MAC survives the driver reprobe that bin/wifi-radio-reset.sh performs,
#     and the daemon re-resolves the interface name from it if it changes.
#
# This is the FACTORY address (NM's PermHwAddress), not the address the
# interface is currently wearing -- MAC randomization is on, so `ip link` shows
# something else entirely and that something else changes.  Read it with:
#
#   busctl --system get-property org.freedesktop.NetworkManager \
#       "$(busctl --system call org.freedesktop.NetworkManager \
#           /org/freedesktop/NetworkManager \
#           org.freedesktop.NetworkManager GetDeviceByIpIface s wlp1s0 |
#           cut -d'"' -f2)" \
#       org.freedesktop.NetworkManager.Device.Wireless PermHwAddress
#
# Removing --device entirely is allowed and makes the daemon auto-select a
# radio that is NOT carrying the host's default route.  For this configuration
# that guard now picks the wrong radio -- it would avoid wlp1s0, which is
# exactly the one we want.  Name the radio.
#
# NOTE: the installer writes this file only when it is absent, so editing it in
# the repo does not update a host that already has one.  Edit
# /etc/waydroid-wifid.conf there and `systemctl restart waydroid-wifid`.
#
# --------------------------------------------------------------- the logging
#
# --verbose costs roughly 90 lines a minute while Android is scanning, which
# journald absorbs without trouble.  It is on by default because the two faults
# Stage 5 has left open -- the rtw88 wedge and the framework not retrying after
# the daemon goes away -- are intermittent and unexplained, and the only way to
# catch either is to already have been logging when it happened.  Drop it if
# the journal volume ever becomes the problem.
#
# It also stays on because the primary-radio configuration above is new and
# is being watched in service rather than declared stable -- docs/38.

WAYDROID_WIFID_ARGS=--device 60:57:18:0A:E8:B7 --verbose
