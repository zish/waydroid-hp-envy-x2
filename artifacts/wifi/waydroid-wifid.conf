# Arguments for waydroid-wifid, read by waydroid-wifid.service.
#
# Installed at /etc/waydroid-wifid.conf.  Edit it and
# `systemctl restart waydroid-wifid`; the unit itself never needs touching.
#
# ---------------------------------------------------------------- the radio
#
# 34:E8:94:F8:61:70 is the TP-Link Archer T3U (2357:012d, rtw88_8822bu) added
# in docs/34-wifi-second-radio.md.  It is given as a MAC and not as wlp0s20u1
# for a reason that matters here more than anywhere else:
#
#   * wlp0s20u1 encodes the USB socket the adapter is in, so moving it one
#     port along renames it -- and this file is read by something unattended,
#     with nobody watching to notice.
#   * The daemon treats a --device it cannot find as FATAL rather than falling
#     back, so a stale name means Wi-Fi is simply down.  That is the safe
#     failure; the unsafe one is Android auto-selecting the host's own wlp1s0
#     and being able to disconnect the link this machine is administered over.
#   * A MAC survives the driver reprobe that bin/wifi-radio-reset.sh performs,
#     and the daemon re-resolves the interface name from it if it changes.
#
# This is the adapter's FACTORY address (NM's PermHwAddress), not the address
# it is currently wearing -- MAC randomization is on, so `ip link` shows
# something else entirely and that something else changes.  Read it with:
#
#   busctl --system get-property org.freedesktop.NetworkManager \
#       "$(busctl --system call org.freedesktop.NetworkManager \
#           /org/freedesktop/NetworkManager \
#           org.freedesktop.NetworkManager GetDeviceByIpIface s wlp0s20u1 |
#           cut -d'"' -f2)" \
#       org.freedesktop.NetworkManager.Device.Wireless PermHwAddress
#
# Removing --device entirely is allowed and makes the daemon auto-select a
# radio that is not carrying the host's default route.  That is a guard, not a
# guarantee: if the host's radio happens to be down when the daemon looks,
# nothing carries a default route and the first entry wins.  Name the radio.
#
# --------------------------------------------------------------- the logging
#
# --verbose costs roughly 90 lines a minute while Android is scanning, which
# journald absorbs without trouble.  It is on by default because the two faults
# Stage 5 has left open -- the rtw88 wedge and the framework not retrying after
# the daemon goes away -- are intermittent and unexplained, and the only way to
# catch either is to already have been logging when it happened.  Drop it if
# the journal volume ever becomes the problem.

WAYDROID_WIFID_ARGS=--device 34:E8:94:F8:61:70 --verbose
