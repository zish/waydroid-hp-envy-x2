# Give Android a chance to shut itself down before the container is killed.
#
# Installed at
# /etc/systemd/system/waydroid-container.service.d/graceful-shutdown.conf.
# Deleting this file restores stock behaviour exactly.

[Service]
# Runs before systemd's SIGTERM reaches the container manager, so Android gets its
# shutdown sequence while every part of Waydroid is still up. Covers host shutdown,
# reboot, and `systemctl stop waydroid-container`.
ExecStop=/usr/local/bin/waydroid-shutdown-android

# Deliberately NOT paired with an lxc-stop shim on this unit's PATH. That was
# tried, to catch the session-driven stops (logout, `waydroid session stop`) that
# never reach ExecStop, and it does not work: session_manager.Stop() runs
# do_stop() and hardware_manager.stop() before lxc-stop, so by then the Wayland
# session and the hardware binder service Android's shutdown needs are already
# gone. It cost 30 s and still ended in the hard kill. See docs/23.

# Default is 45 s, and Fedora sets TimeoutStopFailureMode=abort for every service,
# so overrunning would SIGABRT the container manager and dump core. The script is
# bounded at 30 s; this leaves room for the teardown that follows it.
TimeoutStopSec=60
