# Give the Waydroid container a usable RLIMIT_NICE, so binder priority
# inheritance works instead of being silently skipped.
#
# Installed at
# /etc/systemd/system/waydroid-container.service.d/nice-limit.conf.
# Deleting this file restores stock behaviour exactly.
#
# systemd's default is RLIMIT_NICE=0. The kernel's binder driver converts that
# with rlimit_to_nice(r) = 20 - r, producing a floor of nice 20 -- one above
# MAX_NICE (19). binder_do_set_priority() reads that as "the limit was never
# set", logs
#
#     binder: <tid> RLIMIT_NICE not set
#
# and returns WITHOUT applying the calling thread's priority. The log spam and
# the lost priority inheritance are therefore the same event, which is why
# silencing the message through the binder debug_mask is not a fix: it would
# leave the inheritance broken and stop mentioning it.
#
# The RLIMIT_NICE branch is only reached when the receiving task lacks
# CAP_SYS_NICE, and the kernel asks with has_capability_noaudit(), which
# consults the LSM. That is why waydroid-sensord hit this and waydroid-wifid
# never did -- sensord runs as waydroid_t, wifid as unconfined_t, both with
# RLIMIT_NICE=0 and both with a full POSIX capability set. Because the query is
# the *noaudit* variant, SELinux records nothing and ausearch is empty.
# See docs/40-binder-nice.md.
#
# Raising the limit here rather than granting waydroid_t CAP_SYS_NICE is
# deliberate. It needs no host policy module, it is applied by systemd as PID 1
# before the SELinux transition so it cannot itself be denied, and it is what
# stock Android's init does for every process anyway.

[Service]
# Raw RLIMIT_NICE, not a nice level. systemd.exec(5): a value prefixed with "+"
# or "-" is a nice level in -20..19; an unprefixed value is the raw resource
# limit in 0..40. 40 yields a floor of nice -20, which is to say no floor.
LimitNICE=40
