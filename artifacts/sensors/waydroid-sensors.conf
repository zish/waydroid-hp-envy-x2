# waydroid-sensord configuration -- OPTIONAL.
#
# Install to /etc/waydroid-sensors.conf on bigtab01 only if you need to change
# something. The daemon runs correctly with none of this file present; every
# key below is shown at its built-in default.
#
# Re-read only at startup, so restart the session (or SIGTERM the daemon; the
# next start replaces it) after editing.

# How often to poll the IIO nodes, in Hz. Reading three sysfs attributes over
# the sensor hub's i2c link costs 3-7 ms, so this cannot go very high; the
# value also becomes the minDelay the daemon advertises to Android.
poll_hz = 20

# Rotation of the sensor axes about Z, in degrees: 0, 90, 180 or 270.
#
# The sensor values are correct in the hub's own frame -- that is verified. But
# the hub's axes need not line up with the display's natural orientation, and
# on a detachable the panel can be mounted rotated relative to the board. This
# knob exists so that can be corrected by experiment rather than assumption.
#
# It currently does not matter on bigtab01: auto-rotation is off and Waydroid
# renders into a fixed-size Wayland window, so there is no panel orientation to
# track. It would matter for games, compass apps or AR. See docs/14-sensors.md.
axis_rotation = 0

# Magnetometer scale, raw -> microtesla.
#
# Derived from the HID report descriptor (unit 0x1c = GAUSS, unit exponent -3,
# i.e. the hub reports micro-gauss) and confirmed by |B| landing at 53.5 uT.
# Do NOT take this from in_magn_scale, which reads 1.0 and is wrong by 1e4:
# the kernel's unit_conversion[] entry for {COMPASS_3D, GAUSS} assumes a hub
# reporting gauss, and computes 1000 x 10^-3 = exactly 1.0.
magn_scale = 1e-4

# Local geomagnetic field strength in microtesla, used only to judge how
# contaminated a magnetometer reading is: |B| is a property of where the
# machine is standing, so a reading far from this value means something
# ferrous or magnetic is nearby -- the keyboard's attachment magnets are a
# large one. Earth's field runs 25-65 uT with latitude. Default 50.
# Get the real local value from bin/magn-calibrate.py with the keyboard
# DETACHED: the fitted sphere radius is it.
#earth_field_ut = 54
